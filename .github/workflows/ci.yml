name: Enterprise RAG CI Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality-gates:
    name: Backend Tests & Retrieval Evaluation Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Complete Test Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests -v

      - name: Enforce Retrieval Quality Gates
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/evaluate_retrieval.py --dataset expanded --ci --gate-recall 0.85 --gate-mrr 0.80

  frontend-build:
    name: Frontend Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
